name: Staging release smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm smoke:staging
        env:
          STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
          EXPECT_BOOTSTRAP_CLOSED: "true"
